name: Restore foundation media

on:
  workflow_dispatch:
  push:
    branches:
      - feature/foundation-rebuild
    paths:
      - .github/workflows/restore-foundation-media.yml

permissions:
  contents: write

jobs:
  restore-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/foundation-rebuild
          fetch-depth: 0

      - name: Restore verified photo blobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.request

          media = {
              "public/media/hero-community.webp": "c853687a0294b8b5c0bb3adb8c46b2e3f9ee86dc",
              "public/media/gallery-classroom-2.webp": "8407c59c4df412b5bb0dc85c6ca87f2d5664aef8",
              "public/media/gallery-classroom-3.webp": "e53184ba998f3d6f6cdb261aa0fe6547ea303d22",
          }

          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          for destination, sha in media.items():
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/git/blobs/{sha}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "pamela-teffo-foundation-media-restore",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)

              if payload.get("encoding") != "base64":
                  raise RuntimeError(f"Unexpected encoding for {sha}")

              binary = base64.b64decode(payload["content"].replace("\n", ""))
              path = pathlib.Path(destination)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(binary)
              print(f"restored {destination}: {len(binary)} bytes")
          PY

      - name: Commit restored photos
        run: |
          if git diff --quiet -- public/media/hero-community.webp public/media/gallery-classroom-2.webp public/media/gallery-classroom-3.webp; then
            echo "Verified photo files are already present."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/hero-community.webp public/media/gallery-classroom-2.webp public/media/gallery-classroom-3.webp
          git commit -m "fix: restore verified foundation photos"
          git push origin HEAD:feature/foundation-rebuild
